<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
    name="description"
    content="Portfolio of Haley Jones featuring colorful illustrations.">
    <meta name="theme-color" content="#ffffff">

    <title>Haley Jones</title>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <img src="assets/site_logo.png" alt="Haley Jones logo">
            </div>

        <nav class="nav" aria-label="Primary">
            <a href="index.html" class="active" aria-current="page">home</a>
            <a href="about.html" class="about">about</a>
        </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Masonry Grid -->
        <section class="masonry">
            <div class="item"><img src="assets/illustrations/space_door.jpg" alt="Digital illustration of a front door leading to outer space" loading="lazy"></div>
            <div class="item"><img src="assets/illustrations/house_fires.jpg" alt="Digital illustration of a neighborhood with houses on fire" loading="lazy"></div>
            <div class="item"><img src="assets/illustrations/night_drive.jpg" alt="Digital illustration of a car driving on a mountain at night" loading="lazy"></div>
            <div class="item"><img src="assets/illustrations/beer.jpg" alt="Digital illustration of two hands holding beer" loading="lazy"></div>

            <div class="item"><img src="assets/illustrations/cats.jpg" alt="Digital illustration of several cats sitting on a front porch" loading="lazy"></div>
            <div class="item"><img src="assets/illustrations/magnifying_glass.jpg" alt="Digital illustration of a magnifying glass looking at a mountain trail" loading="lazy"></div>
            <div class="item"><img src="assets/illustrations/shower.jpg" alt="Digital illustration of a shower and a sparkly brain" loading="lazy"></div>               
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="socials">
            <!-- Instagram logo icons created by Freepik - Flaticon -->
            <a href="https://www.instagram.com/templesleeper" target="_blank" rel="noopener noreferrer"><img src="assets/instagram.png" alt="Instagram logo"></a>
        </div>

        document.addEventListener("contextmenu", e => e.preventDefault());
